services:
  - type: web
    name: ps22-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: AI_PROVIDER
        value: groq
      - key: MODEL_NAME
        value: openai/gpt-oss-120b
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        value: sqlite:////tmp/ps22.db
      - key: DATASET_PATH
        value: /data/PS22_dataset.xlsx
      - key: MCP_SERVER_URL
        value: http://127.0.0.1:8001/mcp
      - key: MCP_HOST
        value: 127.0.0.1
      - key: MCP_PORT
        value: "8001"
      - key: START_MCP_SERVER
        value: "true"
      - key: CORS_ORIGINS
        value: https://YOUR-VERCEL-DOMAIN.vercel.app,http://localhost:5173
